<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Scout Brief</title>
<style>
@font-face { font-family: Anton; src: url(/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2); }
@font-face { font-family: Plex; src: url(/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2); }
@font-face { font-family: InterTight; font-weight: 800; src: url(/node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2); }
:root { --rgb:139,92,246; --ink:#0d0a14; --panel:#161021; --violet:#8b5cf6; --lilac:#c4b5fd; --paper:#f4f1ff; --muted:#8e84a8; --good:#34d399; --bad:#f43f5e; }
html, body { margin:0; background:#000; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:radial-gradient(ellipse at 50% 38%, rgba(var(--rgb),.16), transparent 62%), var(--ink); font-family:Plex; color:var(--paper); }
.abs { position:absolute; }
#grid { inset:0; background-image: linear-gradient(rgba(var(--rgb),.07) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--rgb),.07) 1px, transparent 1px); background-size: 60px 60px; }
#slab { left:-200px; top:640px; width:1600px; height:340px; background:linear-gradient(90deg, rgba(var(--rgb),.0), rgba(var(--rgb),.22), rgba(var(--rgb),.0)); transform:rotate(-14deg); }
#vignette { inset:0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%); }
#wordmark { left:60px; top:150px; font-family:InterTight; font-weight:800; font-size:34px; letter-spacing:2px; }
#wordmark b { color:var(--violet); }
#pill { right:60px; top:142px; border:2px solid var(--violet); border-radius:40px; padding:10px 22px; font-size:28px; letter-spacing:1px; background:rgba(var(--rgb),.12); }
#handle { left:60px; top:1580px; z-index:6; font-size:26px; color:var(--muted); }
#source { right:60px; top:1580px; z-index:6; font-size:22px; color:var(--muted); max-width:620px; text-align:right; }
/* 3D hosts (Scout Files): footer sits over desk props, so give it a dark backing */
body.host3d #handle, body.host3d #source { background:rgba(8,5,5,.85); color:#e9dfd2; padding:6px 14px; border-radius:10px; }
body.host3d #source:empty { display:none; }
#cards { left:60px; top:250px; width:960px; height:640px; }
.card { position:absolute; inset:0; opacity:0; }
.kicker { display:inline-block; background:var(--violet); color:var(--ink); font-size:30px; padding:8px 18px; letter-spacing:2px; }
.big { font-family:Anton; font-size:150px; line-height:.95; text-transform:uppercase; margin-top:24px; }
.big .hl { color:var(--violet); }
.year { font-family:Anton; font-size:44px; color:var(--lilac); letter-spacing:3px; margin-top:20px; }
.quote { font-family:Anton; font-size:84px; line-height:1.02; margin-top:26px; }
.quote .qm { color:var(--violet); font-size:170px; line-height:1; display:block; height:96px; overflow:hidden; margin-top:4px; }
/* kinetic hook: words slam in one by one */
.kin { font-family:Anton; font-size:118px; line-height:1.0; text-transform:uppercase; margin-top:26px; }
.kin .ln { display:block; white-space:nowrap; }
.kin .kw { display:inline-block; margin-right:22px; transform-origin:50% 70%; will-change:transform; }
.kin .kw.hl { color:var(--violet); position:relative; }
.kin .kw.hl::after { content:""; position:absolute; left:-6px; right:-6px; bottom:6px; height:16px; background:var(--violet); opacity:.35; transform:scaleX(var(--u,0)); transform-origin:left; }
.kstamp { position:absolute; right:30px; top:300px; border:9px solid var(--violet); color:var(--violet); font-family:Anton; font-size:92px; padding:4px 26px; line-height:1; border-radius:12px; letter-spacing:2px; background:rgba(13,10,20,.45); }
/* evidence board */
.board { position:absolute; left:-40px; top:70px; width:1040px; height:600px; border-radius:18px; overflow:hidden;
  background: radial-gradient(circle at 30% 20%, rgba(255,220,170,.12), transparent 60%), repeating-radial-gradient(circle at 17% 31%, #6b4a2c 0 2px, #5d3f25 2px 5px), #5a3d24;
  box-shadow: inset 0 0 0 10px #2a1a10, inset 0 0 80px rgba(0,0,0,.65), 0 20px 50px rgba(0,0,0,.6); }
.board .cam { position:absolute; inset:0; transform-origin:0 0; }
.board svg.strings { position:absolute; inset:0; overflow:visible; }
.bi { position:absolute; transform-origin:50% 0; filter: drop-shadow(0 10px 14px rgba(0,0,0,.55)); }
.bi .pin { position:absolute; top:-10px; left:50%; width:24px; height:24px; margin-left:-12px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, #b3121b 60%, #5a0a0e); box-shadow: 0 3px 4px rgba(0,0,0,.5); z-index:2; }
.bi.clip { background:#efe6d2; color:#1d1712; padding:22px 26px 18px; font-family:"Times New Roman", Georgia, serif; }
.bi.clip .h { font-family:Anton; font-size:44px; line-height:1; letter-spacing:.5px; margin-bottom:10px; text-transform:uppercase; }
.bi.clip .t { font-size:27px; line-height:1.25; }
.bi.clip .s { font-family:Plex; font-size:18px; color:#7a6a58; margin-top:10px; letter-spacing:1px; text-transform:uppercase; }
.bi.note { background:#f4d35e; color:#1d1712; padding:18px 22px; text-align:center; }
.bi.note .big { font-family:Anton; font-size:150px; line-height:.95; }
.bi.note .t { font-family:Plex; font-size:26px; text-transform:uppercase; letter-spacing:2px; }
.bi.quote { background:#f7f2e7; color:#1d1712; padding:26px 30px 20px; font-family:Georgia, serif; font-size:38px; line-height:1.25; font-style:italic; }
.bi.quote .mark { background-image: linear-gradient(transparent 55%, rgba(255,214,0,.85) 55%, rgba(255,214,0,.85) 92%, transparent 92%); background-repeat:no-repeat; background-size: var(--hw,0%) 100%; }
.bi.quote .w { display:block; font-family:Plex; font-style:normal; font-size:20px; color:#6f6250; margin-top:14px; letter-spacing:1px; text-transform:uppercase; }
.bi.stamp { border:12px solid #c4161c; color:#c4161c; font-family:Anton; font-size:120px; line-height:1; padding:6px 28px; border-radius:14px; letter-spacing:4px; mix-blend-mode:normal; background:rgba(255,240,230,.08); filter:none; }
.who { font-size:34px; color:var(--lilac); margin-top:22px; letter-spacing:1px; }
.mask { display:block; overflow:hidden; padding-top:.14em; margin-top:-.14em; }
.mask > span { display:inline-block; }
.panel { background:var(--panel); border:2px solid rgba(var(--rgb),.35); border-radius:18px; padding:24px 36px; }
.ctitle { font-family:Anton; font-size:64px; text-transform:uppercase; line-height:1; margin:18px 0 26px; }
.row { margin:0 0 14px; }
.row .lab { font-size:26px; color:var(--lilac); letter-spacing:1px; text-align:center; margin-bottom:8px; }
.bars { display:flex; align-items:center; gap:14px; }
.bars .v { font-family:Anton; font-size:52px; width:150px; }
.bars .v.r { text-align:right; }
.track { flex:1; height:30px; display:flex; gap:6px; }
.track .a, .track .b { height:100%; border-radius:6px; }
.track .a { background:var(--violet); margin-left:auto; }
.track .b { background:var(--lilac); }
.half { flex:1; display:flex; }
.teamhead { display:flex; justify-content:space-between; font-family:Anton; font-size:44px; margin-bottom:18px; }
.player .name { font-family:Anton; font-size:118px; line-height:1.12; text-transform:uppercase; }
.player .team { font-size:30px; color:var(--muted); margin-top:6px; }
.rating { position:absolute; right:0; top:0; width:200px; height:200px; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.rating .n { font-family:Anton; font-size:96px; line-height:1; }
.rating .l { font-size:22px; letter-spacing:2px; }
.stats { margin-top:30px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.stat { background:var(--panel); border-radius:14px; padding:18px 22px; border-left:6px solid var(--violet); }
.stat .sv { font-family:Anton; font-size:58px; line-height:1; }
.stat .sl { font-size:22px; color:var(--lilac); margin-top:6px; }
.counter { font-family:Anton; font-size:260px; line-height:1; color:var(--violet); }
.unit { font-family:Anton; font-size:80px; color:var(--paper); margin-left:12px; }
.sub { font-size:34px; color:var(--lilac); line-height:1.35; margin-top:10px; }
#captions { left:40px; top:1408px; width:1000px; height:104px; display:flex; align-items:center; justify-content:center; text-align:center; font-family:Anton; font-size:58px; text-transform:uppercase; line-height:1.05; z-index:5; }
#captions .w { opacity:.55; margin:0 8px; display:inline-block; }
#captions .w.on { opacity:1; color:var(--paper); }
#captions .w.now { color:var(--violet); opacity:1; }
#presenter { left:190px; top:790px; width:700px; height:760px; z-index:3; }
.stamp { position:absolute; right:10px; top:400px; border:10px solid #f2c230; color:#f2c230; font-family:Anton; font-size:120px; padding:6px 30px; line-height:1; text-transform:uppercase; border-radius:16px; background:rgba(13,10,20,.55); }
#flash { inset:0; background:#ff2a2a; opacity:0; mix-blend-mode:screen; z-index:9; }
#poster { inset:0; z-index:10; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid" class="abs"></div>
  <div id="slab" class="abs"></div>
  <div id="cards" class="abs"></div>
  <div id="presenter" class="abs"></div>
  <div id="captions" class="abs"></div>
  <div id="vignette" class="abs"></div>
  <div id="wordmark" class="abs">THE SCOUT <b>BRIEF</b>™</div>
  <div id="pill" class="abs"></div>
  <div id="handle" class="abs">@thescoutbrief</div>
  <div id="source" class="abs"></div>
  <div id="flash" class="abs"></div>
</div>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module">
import { createPresenter, emotionAt, slamAt, fistAt } from "/presenter/presenter.js";

const q = new URLSearchParams(location.search);
const dir = q.get("reel");
const [reel, timing, mouth] = await Promise.all(
  ["reel.json", "timing.json", "mouth.json"].map((f) => fetch(`/${dir}/${f}`).then((r) => r.json())));
const FPS = 30;
const beats = reel.beats.map((b, i) => ({ ...b, ...timing.beats[i] }));
const DUR = timing.duration;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const expo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const cubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const hl = (s) => esc(s).replace(/\*(.+?)\*/g, '<span class="hl">$1</span>');   // *word* = violet

// ---------- chrome ----------
const m = reel.match || {};

// ---------- league theme (config/teams.json -> league_themes) ----------
const themes = (await fetch("/config/teams.json").then((r) => r.json())).league_themes || {};
function themeKey(league) {
  const want = String(league || "").toLowerCase();
  for (const [key, names] of Object.entries(themes.aliases || {}))
    if (names.some((n) => n.toLowerCase() === want)) return key;
  return themes[league] ? league : themes.default;
}
const TH = themes[themeKey(m.league || m.competition)] || {};
const rootStyle = document.documentElement.style;
for (const [v, k] of [["--ink", "ink"], ["--panel", "panel"], ["--violet", "accent"], ["--lilac", "soft"], ["--muted", "muted"], ["--rgb", "rgb"]])
  if (TH[k]) rootStyle.setProperty(v, TH[k]);
document.getElementById("pill").textContent = m.pill || [m.home, m.score, m.away].filter(Boolean).join(" ");
const sourceEl = document.getElementById("source");

// ---------- cards ----------
// card windows: a beat's card stays until a later beat brings a new one
const cardsEl = document.getElementById("cards");
const shots = [];
beats.forEach((b, i) => {
  if (!b.card) return;
  const prevEnd = shots.length ? null : 0;
  shots.push({ beat: i, start: Math.max(0, b.start - 0.25), card: b.card });
});
shots.forEach((s, i) => (s.end = i + 1 < shots.length ? shots[i + 1].start : DUR + 1));

function build(c) {
  const d = document.createElement("div");
  d.className = "card";
  const kick = c.kicker ? `<div class="kicker">${esc(c.kicker)}</div>` : "";
  if (c.type === "hook" || c.type === "outro") {
    const lines = c.text.split("\n").map((l) => `<span class="mask"><span>${hl(l)}</span></span>`).join("");
    d.innerHTML = `${kick}<div class="big" style="font-size:${c.size || 150}px">${lines}</div>`;
  } else if (c.type === "banter") {
    const lines = c.text.split("\n").map((l) => `<span class="mask"><span>${hl(l)}</span></span>`).join("");
    d.innerHTML = `<div class="kicker" style="background:#f2c230">${esc(c.kicker || "BANTER ALERT")}</div><div class="big" style="font-size:${c.size || 130}px">${lines}</div>${c.stamp ? `<div class="stamp">${esc(c.stamp)}</div>` : ""}<div class="sub">${hl(c.sub || "")}</div>`;
  } else if (c.type === "compare") {
    const rows = c.rows.map((r) => `<div class="row"><div class="lab">${esc(r.label)}</div><div class="bars"><div class="v">${esc(r.fa ?? r.a)}</div><div class="track"><div class="half"><div class="a"></div></div><div class="half"><div class="b"></div></div></div><div class="v r">${esc(r.fb ?? r.b)}</div></div></div>`).join("");
    d.innerHTML = `${kick}<div class="panel" style="margin-top:20px"><div class="teamhead"><span style="color:var(--violet)">${esc(c.teams[0])}</span><span style="color:var(--lilac)">${esc(c.teams[1])}</span></div>${rows}</div>`;
  } else if (c.type === "player") {
    const good = c.verdict !== "worst";
    const col = good ? "var(--good)" : "var(--bad)";
    const stats = (c.stats || []).map(([l, v]) => `<div class="stat" style="border-color:${col}"><div class="sv">${esc(v)}</div><div class="sl">${esc(l)}</div></div>`).join("");
    d.innerHTML = `<div class="kicker" style="background:${col}">${esc(c.kicker || (good ? "BEST ON THE PITCH" : "WORST ON THE PITCH"))}</div>
      <div class="player" style="position:relative;margin-top:26px">
        <div class="name">${(c.name || "").split(" ").map((w) => `<span class="mask"><span>${esc(w)}</span></span>`).join("")}</div>
        <div class="team">${esc(c.team || "")}</div>
        ${c.rating != null && !["", "–", "—", "-"].includes(String(c.rating).trim()) ? `<div class="rating" style="background:${col};color:var(--ink)"><div class="n">${esc(c.rating)}</div><div class="l">${esc(c.ratingLabel || "RATING")}</div></div>` : ""}
      </div><div class="stats"${(c.stats || []).length === 3 ? ' style="grid-template-columns:1fr 1fr 1fr"' : ""}>${stats}</div>`;
  } else if (c.type === "stat") {
    d.innerHTML = `${kick}<div style="margin-top:30px"><span class="counter">0</span><span class="unit">${esc(c.unit || "")}</span></div><div class="ctitle" style="font-size:60px">${hl(c.label || "")}</div><div class="sub">${hl(c.sub || "")}</div>`;
  } else if (c.type === "chapter") {
    // story reels: kicker "CHAPTER 2", optional year/place line, big text, optional sub
    const lines = c.text.split("\n").map((l) => `<span class="mask"><span>${hl(l)}</span></span>`).join("");
    d.innerHTML = `${kick}${c.year ? `<div class="year">${esc(c.year)}</div>` : ""}<div class="big" style="font-size:${c.size || 120}px">${lines}</div><div class="sub">${hl(c.sub || "")}</div>`;
  } else if (c.type === "quote") {
    // a sourced, verbatim quote: text + who said it and where
    const lines = c.text.split("\n").map((l) => `<span class="mask"><span>${hl(l)}</span></span>`).join("");
    d.innerHTML = `${kick}<div class="quote" style="font-size:${c.size || 84}px"><span class="qm">“</span>${lines}</div><div class="who">— ${esc(c.who || "")}</div>`;
  } else if (c.type === "kinetic") {
    // word-by-word slam; *word* = accent + underline wipe
    const lines = c.text.split("\n").map((l) => `<span class="ln">${l.split(/\s+/).filter(Boolean).map((w) => {
      const h = /^\*.*\*[.,!?]*$/.test(w); return `<span class="kw${h ? " hl" : ""}">${esc(w.replace(/\*/g, ""))}</span>`; }).join("")}</span>`).join("");
    d.innerHTML = `${kick}<div class="kin">${lines}</div>${c.stamp ? `<div class="kstamp">${esc(c.stamp)}</div>` : ""}`;
  } else if (c.type === "board") {
    // evidence board: pinned clippings, notes, quotes and stamps, red strings, a slow camera across it
    const items = (c.items || []).map((it, i) => {
      const pin = it.kind === "stamp" ? "" : '<div class="pin"></div>';
      let inner = "";
      if (it.kind === "clip") inner = `<div class="h">${esc(it.head || "")}</div><div class="t">${esc(it.text || "")}</div>${it.sub ? `<div class="s">${esc(it.sub)}</div>` : ""}`;
      else if (it.kind === "note") inner = `<div class="big">${esc(it.big || "")}</div><div class="t">${esc(it.text || "")}</div>`;
      else if (it.kind === "quote") inner = `“${esc(it.text || "").replace(/\*(.+?)\*/g, '<span class="mark">$1</span>')}”${it.who ? `<span class="w">— ${esc(it.who)}</span>` : ""}`;
      else if (it.kind === "stamp") inner = esc(it.text || "");
      return `<div class="bi ${it.kind}" data-i="${i}" style="left:${it.x}px;top:${it.y}px;${it.w ? `width:${it.w}px;` : ""}">${pin}${inner}</div>`;
    }).join("");
    d.innerHTML = `${kick}<div class="board"><div class="cam"><svg class="strings" width="1040" height="600"></svg>${items}</div></div>`;
  } else if (c.type === "formation") {
    d.innerHTML = `${kick}<div class="ctitle">${hl(c.title || "")}</div><svg class="pitch" viewBox="0 0 960 470" width="960" height="470"></svg>`;
  }
  cardsEl.appendChild(d);
  return d;
}
shots.forEach((s) => (s.el = build(s.card)));

// ---------- kinetic hook ----------
function drawKinetic(s, t, cover) {
  const ws = [...s.el.querySelectorAll(".kw")];
  const b = beats[s.beat], speak = Math.max(0.6, (b.end - b.start) * 0.85);
  ws.forEach((w, i) => {
    const at = b.start + 0.05 + (i / ws.length) * speak;     // words land roughly as they are spoken
    const k = cover ? 1 : p(t, at, at + 0.22);
    const sc = cover ? 1 : (k <= 0 ? 0 : 1 + (1 - back(k)) * 0.0 + (1 - k) * 0.9);
    w.style.opacity = k > 0 ? 1 : 0;
    w.style.transform = `scale(${sc}) rotate(${(1 - k) * (i % 2 ? 6 : -6)}deg) translateY(${(1 - k) * 40}px)`;
    if (w.classList.contains("hl")) w.style.setProperty("--u", cover ? 1 : expo(p(t, at + 0.2, at + 0.6)));
  });
  const st = s.el.querySelector(".kstamp");
  if (st) {
    const at = b.start + speak + 0.1, k = cover ? 1 : p(t, at, at + 0.16);
    st.style.opacity = k > 0 ? 1 : 0;
    st.style.transform = `rotate(-10deg) scale(${1 + (1 - k) * 1.8})`;
  }
  // tiny shake on each word landing
  const last = ws.reduce((m, w, i) => { const at = b.start + 0.05 + (i / ws.length) * speak; return t >= at ? at : m; }, -9);
  const j = cover ? 0 : Math.exp(-(t - last) * 18) * 6;
  s.el.querySelector(".kin").style.translate = `${Math.sin(t * 90) * j}px ${Math.cos(t * 70) * j * 0.6}px`;
}

// ---------- evidence board ----------
function itemTime(s, it) {
  const bi = it.beat != null && beats[it.beat] ? beats[it.beat].start : beats[s.beat].start;
  return bi + (it.at || 0);
}
function drawBoard(s, t, cover) {
  const c = s.card, els = [...s.el.querySelectorAll(".bi")];
  const times = (c.items || []).map((it) => itemTime(s, it));
  els.forEach((el, i) => {
    const it = c.items[i], at = times[i];
    const k = cover ? 1 : p(t, at, at + (it.kind === "stamp" ? 0.18 : 0.5));
    el.style.opacity = k > 0 ? 1 : 0;
    if (it.kind === "stamp") el.style.transform = `rotate(${it.rot || -12}deg) scale(${1 + (1 - k) * 2.2})`;
    else el.style.transform = `translateY(${(1 - back(k)) * -160}px) rotate(${(it.rot || 0) + (1 - k) * 14}deg)`;
    const m = el.querySelector(".mark");
    if (m) m.style.setProperty("--hw", `${(cover ? 1 : cubic(p(t, at + 1.2, at + 3.2))) * 100}%`);
  });
  // red strings draw between pinned items
  const svg = s.el.querySelector("svg.strings");
  if (!svg.dataset.init) {
    svg.innerHTML = (c.strings || []).map(() => '<line stroke="#d11a24" stroke-width="5" stroke-linecap="round"/>').join("");
    svg.dataset.init = 1;
  }
  const centre = (i) => { const it = c.items[i]; return [it.x + (it.w || 300) / 2, it.y + 12]; };
  [...svg.querySelectorAll("line")].forEach((ln, n) => {
    const [a, b2, delay] = c.strings[n];
    const at = times[b2] + (delay == null ? 0.35 : delay);          // the string runs once the item it points to is pinned
    const k = cover ? 1 : cubic(p(t, at, at + 0.7));
    const [x1, y1] = centre(a), [x2, y2] = centre(b2);
    ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
    ln.setAttribute("x2", x1 + (x2 - x1) * k); ln.setAttribute("y2", y1 + (y2 - y1) * k);
    ln.style.opacity = k > 0 ? 0.9 : 0;
  });
  // camera: always moving; glides toward the newest item, slow push-in over the whole board
  const shown = times.map((at, i) => [at, i]).filter(([at]) => cover || t >= at);
  const focusOf = (i) => { const it = c.items[i]; return [it.x + (it.w || 300) / 2, it.y + 120]; };
  let fx = 520, fy = 300;
  if (shown.length) {
    const [atN, iN] = shown[shown.length - 1];
    const prev = shown.length > 1 ? focusOf(shown[shown.length - 2][1]) : [520, 300];
    const k = cover ? 1 : cubic(p(t, atN, atN + 1.1));
    const cur = focusOf(iN);
    fx = prev[0] + (cur[0] - prev[0]) * k; fy = prev[1] + (cur[1] - prev[1]) * k;
  }
  const span = Math.max(1, (beats[beats.length - 1].end - s.start));
  const z = 0.9 + 0.08 * p(t, s.start, s.start + span);          // slow push-in over the whole board
  const tx = 520 + (fx - 520) * 0.7 - fx * z, ty = 300 + (fy - 300) * 0.7 - fy * z;   // keep the newest item near centre
  const cam = s.el.querySelector(".cam");
  cam.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
}

// formation: list of [x,y] in a 0..1 box for "4-3-3" etc. (own goal at left)
function formation(str) {
  const rows = str.split("-").map(Number);
  const pts = [[0.06, 0.5]];
  rows.forEach((n, r) => {
    const x = 0.2 + (r * 0.72) / Math.max(1, rows.length - 1) * 0.95;
    for (let k = 0; k < n; k++) pts.push([x, n === 1 ? 0.5 : 0.12 + (k * 0.76) / (n - 1)]);
  });
  return pts;
}
function drawPitch(s, t) {
  const svg = s.el.querySelector("svg.pitch");
  if (!svg.dataset.init) {
    svg.innerHTML = `<rect x="2" y="2" width="956" height="466" rx="14" fill="#122019" stroke="#2f5a43" stroke-width="3"/>
      <line x1="480" y1="2" x2="480" y2="468" stroke="#2f5a43" stroke-width="3"/><circle cx="480" cy="235" r="60" fill="none" stroke="#2f5a43" stroke-width="3"/>
      <rect x="2" y="120" width="110" height="230" fill="none" stroke="#2f5a43" stroke-width="3"/><rect x="848" y="120" width="110" height="230" fill="none" stroke="#2f5a43" stroke-width="3"/>
      <text class="ftxt" x="940" y="50" text-anchor="end" font-family="Anton" font-size="46" fill="#f4f1ff"></text>`;
    for (let i = 0; i < 11; i++) svg.insertAdjacentHTML("beforeend", `<circle class="dot" r="20" fill="${getComputedStyle(document.documentElement).getPropertyValue('--violet').trim()}" stroke="#f4f1ff" stroke-width="4"/>`);
    svg.dataset.init = 1;
  }
  const A = formation(s.card.before), B = formation(s.card.after || s.card.before);
  const k = cubic(p(t, s.start + 1.4, s.start + 2.4));
  svg.querySelector(".ftxt").textContent = k < 0.5 ? s.card.before : s.card.after;
  svg.querySelectorAll(".dot").forEach((c, i) => {
    const a = A[i] || A[0], b = B[i] || B[0];
    c.setAttribute("cx", 20 + (a[0] + (b[0] - a[0]) * k) * 900);
    c.setAttribute("cy", 20 + (a[1] + (b[1] - a[1]) * k) * 430);
    c.setAttribute("opacity", p(t, s.start + 0.2 + i * 0.04, s.start + 0.5 + i * 0.04));
  });
}

function drawCard(s, t) {
  const cover = s === shots[0] && t < Math.max(s.start, 0.001);  // first frame doubles as the Instagram cover
  const inK = cover ? 1 : expo(p(t, s.start, s.start + 0.45));
  const outK = cubic(p(t, s.end - 0.3, s.end));
  const on = cover || (t >= s.start && t < s.end);
  s.el.style.opacity = on ? 1 - outK : 0;
  s.el.style.transform = `translateY(${(1 - inK) * 160 - outK * 140}px)`;
  if (!on) return;
  const c = s.card;
  s.el.querySelectorAll(".mask > span").forEach((sp, i) => {
    const k = cover ? 1 : expo(p(t, s.start + 0.1 + i * 0.09, s.start + 0.55 + i * 0.09));
    sp.style.transform = `translateY(${(1 - k) * 110}%)`;
    sp.style.opacity = k > 0.01 ? 1 : 0;
  });
  if (c.type === "compare") {
    s.el.querySelectorAll(".row").forEach((row, i) => {
      const r = c.rows[i], tot = (Number(r.a) + Number(r.b)) || 1;
      const k = expo(p(t, s.start + 0.4 + i * 0.25, s.start + 1.2 + i * 0.25));
      row.querySelector(".a").style.width = `${(Number(r.a) / tot) * 100 * k}%`;
      row.querySelector(".b").style.width = `${(Number(r.b) / tot) * 100 * k}%`;
      row.style.opacity = p(t, s.start + 0.3 + i * 0.25, s.start + 0.5 + i * 0.25);
    });
  }
  if (c.type === "stat") {
    const k = expo(p(t, s.start + 0.2, s.start + 1.4));
    const v = Number(c.value) * k, dec = c.decimals ?? (String(c.value).split(".")[1] || "").length;
    s.el.querySelector(".counter").textContent = v.toFixed(dec);
  }
  if (c.type === "player") {
    const r = s.el.querySelector(".rating");
    if (r) { const k = back(p(t, s.start + 0.6, s.start + 1.0)); r.style.transform = `scale(${k}) rotate(${(1 - k) * -20 + 4}deg)`; }
    s.el.querySelectorAll(".stat").forEach((st, i) => {
      const k = expo(p(t, s.start + 0.9 + i * 0.15, s.start + 1.3 + i * 0.15));
      st.style.opacity = k; st.style.transform = `translateX(${(1 - k) * 60}px)`;
    });
  }
  if (c.type === "formation") drawPitch(s, t);
  if (c.type === "kinetic") drawKinetic(s, t, cover);
  if (c.type === "board") drawBoard(s, t, cover);
  if (c.type === "banter") {
    const st = s.el.querySelector(".stamp");
    if (st) { const k = p(t, s.start + 0.9, s.start + 1.1); st.style.opacity = k > 0 ? 1 : 0; st.style.transform = `rotate(-12deg) scale(${1 + (1 - k) * 1.6})`; }
  }
  sourceEl.textContent = c.source ? `Source: ${c.source}` : "";
}

// ---------- captions (word timing spread across the line by length) ----------
const capEl = document.getElementById("captions");
const capChunks = beats.map((b) => {
  const words = (b.caption || b.say).split(/\s+/).filter(Boolean);
  const total = words.reduce((a, w) => a + w.length + 2, 0);
  let acc = 0;
  const timed = words.map((w) => { const s0 = b.start + (acc / total) * (b.end - b.start); acc += w.length + 2; return { w, s0 }; });
  const chunks = [];
  for (let i = 0; i < timed.length; i += 4) chunks.push(timed.slice(i, i + 4));
  return chunks;
});
let capKey = "";
function drawCaptions(t) {
  let html = "", key = "";
  beats.forEach((b, i) => {
    if (t < b.start - 0.05 || t > b.end + 0.25) return;
    const ch = capChunks[i];
    let idx = 0;
    ch.forEach((c, j) => { if (t >= c[0].s0 - 0.05) idx = j; });
    const c = ch[idx];
    key = i + ":" + idx + ":" + c.filter((w) => t >= w.s0).length;
    html = c.map((w, k) => {
      const next = c[k + 1] ? c[k + 1].s0 : b.end;
      const cls = t >= w.s0 ? (t < next ? "w now" : "w on") : "w";
      return `<span class="${cls}">${esc(w.w)}</span>`;
    }).join("");
  });
  if (key !== capKey) { capEl.innerHTML = html; capKey = key; }
}

// ---------- presenter ----------
let pres;
const HOSTS_3D = { detective3d: ["/presenter/detective3d.js", "createDetective"], frog3d: ["/presenter/frog3d.js", "createFrog"] };
if (HOSTS_3D[reel.presenter]) {
  // Scout Files hosts: a 3D character drawn on a full-stage WebGL canvas behind the cards
  const [modPath, fn] = HOSTS_3D[reel.presenter];
  const createDetective = (await import(modPath))[fn];
  for (const id of ["presenter", "grid", "slab"]) document.getElementById(id).style.display = "none";
  document.body.classList.add("host3d");
  Object.assign(document.getElementById("captions").style, { background: "rgba(8,5,5,.72)", borderRadius: "18px", padding: "0 20px", boxSizing: "border-box" });
  // optional story exhibit: reel.prop = { file: "props/x.glb" (relative to the reel folder), beat: n, size: 0.5 }
  const prop = reel.prop && reel.prop.file ? { url: `/${dir}/${reel.prop.file}`, from: reel.prop.beat != null && beats[reel.prop.beat] ? beats[reel.prop.beat].start : 0, size: reel.prop.size } : null;
  pres = createDetective(document.getElementById("stage"), { theme: TH, before: document.getElementById("cards"), mouthTrack: mouth, fps: FPS, pixelRatio: Number(q.get("pr")) || reel.pixel_ratio || 1, prop });
  if (pres.loaded) await pres.loaded;
} else {
  pres = createPresenter(document.getElementById("presenter"), { theme: { accent: TH.accent, suit: TH.suit, desk: TH.desk, lapel: TH.lapel } });
}
const cues = [];
const slams = [];
beats.forEach((b) => {
  cues.push([Math.max(0, b.start - 0.15), b.emotion || "neutral"]);
  (b.emote || []).forEach(([dt, name]) => cues.push([b.start + dt, name]));
  (b.slam || []).forEach((dt) => slams.push(b.start + dt));
  if ((b.emotion === "furious") && !b.slam) slams.push(b.start + 0.35);
});
cues.sort((a, b) => a[0] - b[0]);
const flash = document.getElementById("flash");

window.seek = (t) => {
  for (const s of shots) drawCard(s, t);
  drawCaptions(t);
  const f = Math.min(mouth.length - 1, Math.max(0, Math.round(t * FPS)));
  const emo = emotionAt(cues, t, HOSTS_3D[reel.presenter] ? 0.5 : 0.28);   // the 3D host eases between moods more slowly
  const slam = slamAt(slams, t);
  pres.draw({ t, emo, mouth: mouth[f] || 0, slam, fistY: fistAt(slams, t) });
  // camera: punch on slams, gentle push while angry
  const stage = document.getElementById("stage");
  const sh = slam * 14;
  document.getElementById("cards").style.translate = `${Math.sin(t * 80) * sh}px ${Math.abs(sh) * 0.5}px`;
  flash.style.opacity = Math.max(0, slam) * 0.22 + Math.max(0, emo.red - 0.5) * 0.12;
};
window.DUR = DUR;
await document.fonts.ready;
window.seek(0);
window.ready = true;
</script>
